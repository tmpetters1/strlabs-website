watch_x:
  - bankrbot
  - ponsdotfamily
  - MEADGod

# These are READ AT RUNTIME by scripts/scout_scan.py via common.focus().
# Change them here — do not hardcode filter values in a script or a prompt.
filters:
  min_liq_usd: 5000
  min_mc_usd: 15000
  max_mc_usd: 2000000
  max_candidates_per_run: 5
  notify_min_score: 78
  max_discord_pings_per_day: 8
  # Set >0 to skip brand-new pairs (sniper window). 0 = no age filter.
  min_pair_age_minutes: 0
  max_top1_pct_ex_lp: 25.0

# Scout builds its Dex search queries from launchpad `signals`, `hot_metas` ids
# and `watch_x` handles above — adding a launchpad here changes what is scanned.

notify:
  discord: true
  dashboard: true
  ping_user_id: "217012868514578432"

paths:
