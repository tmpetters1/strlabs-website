<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Timeregistrering</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timeregistrering">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb340'/%3E%3Cstop offset='1' stop-color='%23ff8f00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='69' font-size='56' font-family='-apple-system,Helvetica,sans-serif' font-weight='800' fill='%231a1200' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb340'/%3E%3Cstop offset='1' stop-color='%23ff8f00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ctext x='50' y='69' font-size='56' font-family='-apple-system,Helvetica,sans-serif' font-weight='800' fill='%231a1200' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="app">
    <section id="gate" class="screen">
      <div class="card entrance">
        <div class="icon-badge">🔨</div>
        <h1>Timeregistrering</h1>
        <p class="muted">Skriv inn tilgangskoden for å komme i gang.</p>
        <input id="gateCode" type="password" placeholder="Tilgangskode" autocomplete="off" autocapitalize="off" autocorrect="off">
        <p id="gateError" class="error hidden"></p>
        <button id="gateSubmit" class="primary">Fortsett</button>
      </div>
    </section>

    <section id="namePicker" class="screen hidden">
      <div class="card entrance">
        <h1>Hvem er du?</h1>
        <div id="participantList" class="list"></div>
        <div class="add-name">
          <input id="newName" type="text" placeholder="Nytt navn">
          <button id="addNameBtn" class="secondary">Legg til</button>
        </div>
        <p id="nameError" class="error hidden"></p>
      </div>
    </section>

    <section id="mainApp" class="screen hidden">
      <header class="topbar">
        <div class="tabs">
          <div class="tab-indicator"></div>
          <button class="tab active" data-tab="log">Registrer</button>
          <button class="tab" data-tab="history">Historikk</button>
        </div>
        <button id="switchUserBtn" class="icon-btn" title="Bytt bruker">👤</button>
      </header>

      <div id="tab-log" class="tab-panel active">
        <div class="card entrance">
          <label for="entryDate">Dato</label>
          <input id="entryDate" type="date">

          <label for="entryHours">Timer (f.eks 3,5)</label>
          <input id="entryHours" type="text" inputmode="decimal" placeholder="3,5">

          <label for="entryDescription">Hva ble gjort?</label>
          <textarea id="entryDescription" rows="5" placeholder="Beskriv hva som ble gjort…"></textarea>

          <p id="logError" class="error hidden"></p>
          <button id="saveEntryBtn" class="primary">Lagre</button>
        </div>
      </div>

      <div id="tab-history" class="tab-panel">
        <div id="totals" class="totals"></div>
        <div class="filter-row">
          <button class="filter active" data-filter="all">Alle</button>
          <button class="filter" data-filter="mine">Mine</button>
        </div>
        <div id="entryList" class="entries"></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
