<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Timeregistrering</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timeregistrering">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles/main.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="app">
    <section id="gate" class="screen">
      <div class="card entrance">
        <div class="icon-badge">🔨</div>
        <h1>Timeregistrering</h1>
        <p class="muted">Skriv inn tilgangskoden for å komme i gang.</p>
        <input id="gateCode" type="password" placeholder="Tilgangskode" autocomplete="off" autocapitalize="off" autocorrect="off">
        <p id="gateError" class="error hidden"></p>
        <button id="gateSubmit" class="primary">Fortsett</button>
      </div>
    </section>

    <section id="namePicker" class="screen hidden">
      <div class="card entrance">
        <h1>Hvem er du?</h1>
        <div id="participantList" class="list"></div>
        <div class="add-name">
          <input id="newName" type="text" placeholder="Nytt navn">
          <button id="addNameBtn" class="secondary">Legg til</button>
        </div>
        <p id="nameError" class="error hidden"></p>
      </div>
    </section>

    <section id="mainApp" class="screen hidden">
      <header class="topbar">
        <div class="tabs">
          <div class="tab-indicator"></div>
          <button class="tab active" data-tab="log">Registrer</button>
          <button class="tab" data-tab="history">Historikk</button>
        </div>
        <button id="switchUserBtn" class="icon-btn" title="Bytt bruker">👤</button>
      </header>

      <div id="tab-log" class="tab-panel active">
        <div class="card entrance">
          <label for="entryDate">Dato</label>
          <input id="entryDate" type="date">

          <label for="entryHours">Timer (f.eks 3,5)</label>
          <input id="entryHours" type="text" inputmode="decimal" placeholder="3,5">

          <label for="entryDescription">Hva ble gjort?</label>
          <textarea id="entryDescription" rows="5" placeholder="Beskriv hva som ble gjort…"></textarea>

          <label for="entryPhoto">Bilde (valgfritt)</label>
          <input id="entryPhoto" type="file" accept="image/*" capture="environment">
          <img id="photoPreview" class="photo-preview hidden" alt="">

          <p id="logError" class="error hidden"></p>
          <button id="saveEntryBtn" class="primary">Lagre</button>
        </div>
      </div>

      <div id="tab-history" class="tab-panel">
        <div id="totals" class="totals"></div>
        <div class="filter-row">
          <div class="filter-group">
            <button class="filter active" data-filter="all">Alle</button>
            <button class="filter" data-filter="mine">Mine</button>
          </div>
          <button id="exportBtn" class="icon-btn" title="Eksporter CSV">⬇️</button>
        </div>
        <div id="entryList" class="entries"></div>
      </div>
    </section>
  </div>

  <div id="editModal" class="modal-backdrop hidden">
    <div class="card modal-card">
      <h1>Rediger registrering</h1>
      <label for="editDate">Dato</label>
      <input id="editDate" type="date">

      <label for="editHours">Timer</label>
      <input id="editHours" type="text" inputmode="decimal">

      <label for="editDescription">Hva ble gjort?</label>
      <textarea id="editDescription" rows="4"></textarea>

      <p id="editError" class="error hidden"></p>
      <div class="modal-actions">
        <button id="editDeleteBtn" class="secondary danger">Slett</button>
        <button id="editCancelBtn" class="secondary">Avbryt</button>
        <button id="editSaveBtn" class="primary">Lagre</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
